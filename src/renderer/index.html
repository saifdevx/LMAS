<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy (Checkpoint 5 security review, PRD §7.5):
      only local resources; inline styles for Tailwind/runtime styling;
      ws://localhost:* exists solely for the Vite HMR channel in development
      — the packaged app loads from file:// and never connects anywhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMAS — Laboratory Management & Accounting System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
